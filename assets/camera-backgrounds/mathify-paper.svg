<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
  <title id="title">Mathify paper camera background</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F4EFE3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#12968C" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <g fill="none" stroke="#12968C" stroke-opacity=".20" stroke-width="2">
    <circle cx="126" cy="128" r="66"/>
    <path d="M60 128h132M126 62v132"/>
    <path d="M1410 710l92-52-92-52-92 52z"/>
    <path d="M1318 658h184M1410 606v104"/>
  </g>
  <g fill="#B83A16" fill-opacity=".16" font-family="Poppins, Arial, sans-serif" font-size="34">
    <text x="74" y="800">a² + b² = c²</text>
    <text x="1290" y="150">πr²</text>
  </g>
  <g font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" fill="#1B2433" fill-opacity=".82">
    <text x="1332" y="842">Mathify<tspan fill="#12968C">.</tspan></text>
  </g>
</svg>
