name: Build Mathify for iPhone and iPad

# You trigger this from Windows. Apple's Xcode/iOS SDK only runs on macOS, so a
# GitHub-hosted Mac does the compile/sign step. Nothing in this workflow changes
# the shared web app, business rules, permissions or server code.

on:
  workflow_dispatch:
    inputs:
      web_origin:
        description: HTTPS origin of the deployed Mathify web app
        required: false
        type: string
      export_method:
        description: IPA signing method
        required: true
        default: app-store-connect
        type: choice
        options:
          - app-store-connect
          - ad-hoc
          - development
      version:
        description: Marketing version (CFBundleShortVersionString)
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Build number (CFBundleVersion)
        required: false
        type: string
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 26 / iOS 26 SDK is required for App Store Connect uploads from
    # 28 April 2026. macos-26 is the GitHub runner that carries it.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          ruby -e 'abort "Xcode 26 or later is required" unless `xcodebuild -version`.include?("Xcode 26")'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Resolve web origin
        env:
          INPUT_ORIGIN: ${{ inputs.web_origin }}
          SECRET_ORIGIN: ${{ secrets.MATHIFY_WEB_URL }}
        run: |
          ORIGIN="${INPUT_ORIGIN:-$SECRET_ORIGIN}"
          if [ -z "$ORIGIN" ]; then
            echo "::error::Set MATHIFY_WEB_URL secret or pass web_origin. The iOS app loads the shared HTTPS web app."
            exit 1
          fi
          case "$ORIGIN" in
            https://*) ;;
            *) echo "::error::The production iOS origin must be HTTPS."; exit 1 ;;
          esac
          echo "MATHIFY_WEB_URL=$ORIGIN" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Sync the shared web app into the iOS shell
        working-directory: mobile
        run: npm run sync

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: pod install --repo-update

      - name: Verify signing secrets
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            eval value="\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret $name"
              exit 1
            fi
          done

      - name: Import distribution certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'mathify-ci' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mathify.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" \
            | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile $UUID"

      - name: Set app version and export compliance
        env:
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -euo pipefail
          cd mobile/ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER"
          xcrun agvtool new-marketing-version "$MARKETING_VERSION"
          PLIST="App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Archive unsigned build
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace mobile/ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mathify.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Export signed IPA
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME || 'Mathify' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mathify.learningos</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mathify.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee "$RUNNER_TEMP/export.log"
          ls -lh "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathify-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in API_KEY_BASE64 API_KEY_ID API_ISSUER_ID; do
            eval value="\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret $name required for TestFlight upload"
              exit 1
            fi
          done
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$API_KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mathify.keychain-db" 2>/dev/null || true
